name = "snapshare"
main = "worker/v110.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*", "/client", "/admin"]

[[d1_databases]]
binding = "DB"
database_name = "snapshare-db"
database_id = "6c3998b0-92c8-49b9-bc2a-f7626e39c7a2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "snapshare-media"

[vars]
APP_ORIGIN = "https://snapshare.snapbooth.workers.dev"
TURNSTILE_SITE_KEY = ""
