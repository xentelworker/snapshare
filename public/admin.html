<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapShare Admin</title><link rel="icon" href="/favicon.svg"><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}main{max-width:1100px;margin:auto;padding:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #0000000d}input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1;margin:5px}button{background:#111827;color:white;cursor:pointer}.ghost{background:white;color:#111827}.danger{background:#b91c1c}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.spread{justify-content:space-between}.muted{color:#64748b}.pill{display:inline-block;padding:4px 8px;background:#eef2ff;border-radius:999px;font-size:12px}.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px}.login{max-width:430px;margin:12vh auto}.notice{padding:10px;background:#fff7ed;border-radius:10px}code{word-break:break-all}.archive-list{display:grid;gap:10px}.archive-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border:1px solid #e5e7eb;border-radius:12px}.ok{background:#ecfdf5}.archived{background:#fef2f2}</style></head><body><main id="app"></main><script>
const A='/api/portal';const app=document.getElementById('app');const api=async(p,o={})=>{const r=await fetch(A+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const perms=[['can_edit_branding','Edit event details & branding'],['can_manage_media','Manage uploaded media'],['can_manage_albums','Manage albums'],['can_view_rsvp','View RSVP list'],['can_manage_guestbook','View/manage guestbook'],['can_download','Download event media']];let state={clients:[],events:[],archiveEvents:[],archiveReady:true};
async function boot(){try{const {user}=await api('/me');if(!user)return login();if(user.role!=='admin')return app.innerHTML='<div class="card"><h2>Admin access required</h2><p>This account is not an administrator.</p></div>';await load()}catch(e){if(e.message.includes('migration'))app.innerHTML='<div class="card"><h2>Client portal setup required</h2><p>'+esc(e.message)+'</p></div>';else login()}}
function login(){app.innerHTML='<div class="card login"><h1>SnapShare Admin</h1><p class="muted">Administrator sign in</p><form id="login"><input id="email" type="email" required placeholder="Email"><input id="pw" type="password" required placeholder="Password"><button>Sign In</button></form><p id="msg"></p></div>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const d=await api('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:pw.value})});if(d.user.role!=='admin')throw Error('This account is not an administrator.');boot()}catch(x){msg.textContent=x.message}}}
async function load(){const [c,e]=await Promise.all([api('/admin/clients'),api('/events')]);let archiveEvents=[],archiveReady=true;try{archiveEvents=(await api('/admin/events/archive-status')).events}catch(x){archiveReady=false}state={clients:c.clients,events:e.events,archiveEvents,archiveReady};render()}
function render(){app.innerHTML='<div class="row spread"><div><h1>SnapShare Admin</h1><p class="muted">Manage client access and event lifecycle settings.</p></div><div><button class="ghost" onclick="location.href=\'/client\'">Client Portal</button><button class="ghost" onclick="location.href=\'/\'">Host Portal</button><button class="ghost" onclick="logout()">Sign Out</button></div></div>'+archiveSection()+'<h2>Client Accounts</h2><form id="create" class="card row"><input id="newEmail" type="email" required placeholder="Client email"><input id="newPw" minlength="10" placeholder="Temporary password (optional)"><button>Create Client</button></form><div id="created"></div><div id="clients"></div>';document.getElementById('create').onsubmit=createClient;document.getElementById('clients').innerHTML=state.clients.map(clientCard).join('')}
function archiveSection(){if(!state.archiveReady)return '<section class="card"><h2>Automatic Event Archiving</h2><p class="muted">Apply database migration 0005_event_archiving.sql to enable automatic archiving.</p></section>';return '<section class="card"><h2>Automatic Event Archiving</h2><p class="muted">Events automatically archive 30 days after the event date. Turn this off for any event that should remain active.</p><div class="archive-list">'+(state.archiveEvents.length?state.archiveEvents.map(archiveRow).join(''):'<p>No events yet.</p>')+'</div></section>'}
function archiveRow(e){const on=!!e.auto_archive,status=e.archived_at?'Archived':'Active';return '<div class="archive-row '+(e.archived_at?'archived':'ok')+'"><div><b>'+esc(e.name)+'</b><br><span class="muted">'+esc(e.event_date||'No event date')+' · '+status+'</span></div><label><input type="checkbox" '+(on?'checked':'')+' onchange="setArchive(\''+e.id+'\',this.checked)"> Auto archive after 30 days</label></div>'}
async function setArchive(id,on){try{await api('/admin/events/'+id+'/archive-settings',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({auto_archive:on})});await load()}catch(x){alert(x.message);await load()}}
async function createClient(e){e.preventDefault();try{const d=await api('/admin/clients',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:newEmail.value,password:newPw.value})});document.getElementById('created').innerHTML='<div class="card notice"><h3>Client created</h3><p><b>Email:</b> '+esc(d.client.email)+'</p><p><b>Temporary password:</b> <code>'+esc(d.temporary_password)+'</code></p><p><b>Recovery code:</b> <code>'+esc(d.recovery_code)+'</code></p></div>';await load()}catch(x){alert(x.message)}}
function clientCard(c){const assigned=new Set((c.assignments||[]).map(a=>a.event_id));const available=state.events.filter(e=>!assigned.has(e.id));return '<section class="card"><div class="row spread"><div><h2>'+esc(c.email)+'</h2><span class="pill">'+(c.is_active?'Active':'Disabled')+'</span></div><button class="ghost" onclick="toggleClient(\''+c.id+'\','+(c.is_active?0:1)+')">'+(c.is_active?'Disable Login':'Enable Login')+'</button></div><h3>Assigned Events</h3>'+(c.assignments||[]).map(a=>assignment(c,a)).join('')+(available.length?newAssignment(c,available):'<p class="muted">All events are assigned.</p>')+'</section>'}
function checks(a,prefix){return '<div class="perms">'+perms.map(([k,l])=>'<label><input type="checkbox" id="'+prefix+k+'" '+((a[k]??1)?'checked':'')+'> '+l+'</label>').join('')+'</div>'}
function assignment(c,a){const pre='p'+c.id.replace(/-/g,'')+a.event_id.replace(/-/g,'');return '<div class="card"><div class="row spread"><b>'+esc(a.event_name)+'</b><div><button class="ghost" onclick="openClientPortal(\''+a.event_id+'\')">Open Client Portal</button><button class="danger" onclick="removeAssign(\''+c.id+'\',\''+a.event_id+'\')">Remove</button></div></div>'+checks(a,pre)+'<button onclick="saveAssign(\''+c.id+'\',\''+a.event_id+'\',\''+pre+'\')">Save Permissions</button></div>'}
function newAssignment(c,events){const pre='n'+c.id.replace(/-/g,'');return '<div class="card"><b>Assign another event</b><div><select id="'+pre+'event">'+events.map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join('')+'</select></div>'+checks({},pre)+'<button onclick="saveAssign(\''+c.id+'\',document.getElementById(\''+pre+'event\').value,\''+pre+'\')">Assign Event</button></div>'}
function openClientPortal(eventId){location.href='/client?event='+encodeURIComponent(eventId)}
async function saveAssign(cid,eid,pre){const b={can_edit_features:false};perms.forEach(([k])=>b[k]=document.getElementById(pre+k).checked);try{await api('/admin/clients/'+cid+'/assignments/'+eid,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(b)});await load()}catch(x){alert(x.message)}}
async function removeAssign(cid,eid){if(!confirm('Remove this client from the event?'))return;await api('/admin/clients/'+cid+'/assignments/'+eid,{method:'DELETE'});await load()}
async function toggleClient(id,on){await api('/admin/clients/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({is_active:!!on})});await load()}
async function logout(){await api('/logout',{method:'POST'});location.href='/'}boot();
</script></body></html>
