<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapShare Client Portal</title><link rel="icon" href="/favicon.svg"><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}main{max-width:1100px;margin:auto;padding:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #0000000d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}button,input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid #cbd5e1;margin:4px}button{background:#111827;color:white;cursor:pointer}.ghost{background:white;color:#111827}.danger{background:#b91c1c}.muted{color:#64748b}.tabs button{margin-right:6px}.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.media img,.media video{width:100%;max-height:260px;object-fit:cover;border-radius:10px}.login{max-width:430px;margin:12vh auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}.settings label{display:block;margin:10px 0}.settings input,.settings textarea{width:min(100%,520px);box-sizing:border-box}.event-switch{max-width:320px}</style></head><body><main id="app"></main><script>
const A='/api/portal',app=document.getElementById('app');
const api=async(p,o={})=>{const r=await fetch(A+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,events=[],data=null;
async function boot(){try{user=(await api('/me')).user;if(!user)return login();if(user.role!=='client')return app.innerHTML='<div class="card"><h2>Client account required</h2><p>This portal is for assigned client accounts.</p></div>';await loadEvents()}catch(e){login(e.message)}}
function login(note=''){app.innerHTML='<div class="card login"><h1>SnapShare Client Portal</h1><p class="muted">Sign in to manage your event.</p><form id="loginForm"><input id="email" type="email" required placeholder="Email"><input id="pw" type="password" required placeholder="Password"><button>Sign In</button></form><p>'+esc(note)+'</p></div>';document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{const emailValue=document.getElementById('email').value,pwValue=document.getElementById('pw').value;const d=await api('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:emailValue,password:pwValue})});user=d.user;if(user.role!=='client')throw Error('This is not a client account.');await loadEvents()}catch(x){alert(x.message)}}}
async function loadEvents(){events=(await api('/events')).events;if(!events.length){app.innerHTML='<div class="row spread"><div><h1>Your Event Portal</h1><p class="muted">Signed in as '+esc(user.email)+'</p></div><button class="ghost" onclick="logout()">Sign Out</button></div><div class="card"><h3>No event assigned yet</h3><p>Your event provider will assign an event to this account.</p></div>';return}await openEvent(events[0].id)}
async function openEvent(id){try{data=await api('/events/'+id+'/manage');renderEvent()}catch(e){alert(e.message)}}
function renderEvent(){const e=data.event,p=data.permissions||e.permissions||{};const tabs=['overview',...(p.can_manage_media?['media']:[]),...(p.can_manage_albums?['albums']:[]),...(p.can_manage_guestbook?['guestbook']:[]),...(p.can_view_rsvp?['rsvp']:[]),...(p.can_edit_branding?['settings']:[])];const switcher=events.length>1?'<select class="event-switch" onchange="openEvent(this.value)">'+events.map(x=>'<option value="'+x.id+'" '+(x.id===e.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>':'';app.innerHTML='<div class="row spread"><div><h1>'+esc(e.name)+'</h1><p class="muted">Signed in as '+esc(user.email)+'</p></div><div>'+switcher+'<button class="ghost" onclick="logout()">Sign Out</button></div></div><div class="tabs">'+tabs.map(t=>'<button class="ghost" onclick="tab(\''+t+'\')">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div><div id="panel"></div>';tab('overview')}
function tab(t){const p=data.permissions||{};if(t==='overview')overview();if(t==='media'&&p.can_manage_media)media();if(t==='albums'&&p.can_manage_albums)albums();if(t==='guestbook'&&p.can_manage_guestbook)guestbook();if(t==='rsvp'&&p.can_view_rsvp)rsvp();if(t==='settings'&&p.can_edit_branding)settings()}
function overview(){panel.innerHTML='<div class="grid"><div class="card"><h2>'+data.media.length+'</h2><p>Media items visible to you</p></div><div class="card"><h2>'+data.guestbook.length+'</h2><p>Written messages</p></div><div class="card"><h2>'+data.rsvps.length+'</h2><p>RSVP records</p></div><div class="card"><h2>'+data.albums.length+'</h2><p>Albums</p></div></div><div class="card"><h3>Guest Link</h3><input style="width:min(100%,700px)" readonly value="'+location.origin+'/e/'+esc(data.event.access_key)+'"><button onclick="navigator.clipboard.writeText(\''+location.origin+'/e/'+data.event.access_key+'\')">Copy Link</button></div>'}
function media(){const p=data.permissions||{};panel.innerHTML='<h2>Media</h2><div class="media">'+data.media.filter(m=>!m.is_guestbook).map(m=>'<div class="card">'+(m.type.startsWith('video')?'<video controls src="'+m.url+'"></video>':'<img src="'+(m.thumbnail_url||m.url)+'">')+'<p><b>'+esc(m.guest_name)+'</b><br>'+esc(m.filename)+'</p><span>'+esc(m.status)+'</span><div><button class="ghost" onclick="mediaAction(\''+m.id+'\',\'approved\')">Approve</button><button class="ghost" onclick="mediaAction(\''+m.id+'\',\'hidden\')">Hide</button><button class="danger" onclick="deleteMedia(\''+m.id+'\')">Delete</button></div>'+(p.can_download?'<a href="'+m.url+'" download>Download original</a>':'')+'</div>').join('')+'</div>'}
async function mediaAction(id,status){await api('/media/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status})});await openEvent(data.event.id);media()}
async function deleteMedia(id){if(!confirm('Delete this upload?'))return;await api('/media/'+id,{method:'DELETE'});await openEvent(data.event.id);media()}
function albums(){panel.innerHTML='<h2>Albums</h2><form id="album" class="card"><input id="albumName" required placeholder="Album name"><label><input id="albumPrivate" type="checkbox"> Private album</label><button>Add Album</button></form><div class="grid">'+data.albums.map(a=>'<div class="card"><h3>'+esc(a.name)+'</h3><p>'+(a.is_private?'Private':'Public')+'</p></div>').join('')+'</div>';document.getElementById('album').onsubmit=async e=>{e.preventDefault();await api('/events/'+data.event.id+'/albums',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.getElementById('albumName').value,is_private:document.getElementById('albumPrivate').checked})});await openEvent(data.event.id);albums()}}
function guestbook(){const gm=data.media.filter(m=>m.is_guestbook);panel.innerHTML='<h2>Guestbook</h2>'+data.guestbook.map(g=>'<blockquote class="card">“'+esc(g.message)+'”<br><small>— '+esc(g.guest_name)+'</small></blockquote>').join('')+'<div class="media">'+gm.map(m=>'<div class="card"><b>'+esc(m.guest_name)+'</b>'+(m.type.startsWith('audio')?'<audio controls src="'+m.url+'"></audio>':'<video controls src="'+m.url+'"></video>')+'</div>').join('')+'</div>'}
function rsvp(){panel.innerHTML='<h2>RSVPs</h2><div class="card"><table><tr><th>Name</th><th>Status</th><th>Party</th><th>Email</th><th>Note</th></tr>'+data.rsvps.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.status)+'</td><td>'+r.party_size+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.note)+'</td></tr>').join('')+'</table></div>'}
function settings(){const e=data.event;panel.innerHTML='<div class="card settings"><h2>Event Settings</h2><p class="muted">Event features are assigned by your provider and cannot be changed here.</p><label>Event name<input id="sName" value="'+esc(e.name)+'"></label><label>Event date<input id="sDate" type="date" value="'+esc(e.event_date||'')+'"></label><label>Welcome message<textarea id="sWelcome">'+esc(e.welcome_message||'')+'</textarea></label><label>Accent colour<input id="sColor" type="color" value="'+esc(e.primary_color||'#111827')+'"></label><button onclick="saveSettings()">Save Settings</button></div>'}
async function saveSettings(){const e=data.event,b={name:document.getElementById('sName').value,event_date:document.getElementById('sDate').value,welcome_message:document.getElementById('sWelcome').value,primary_color:document.getElementById('sColor').value};await api('/events/'+e.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(b)});await openEvent(e.id);settings()}
async function logout(){await api('/logout',{method:'POST'});location.reload()}boot();
</script></body></html>
